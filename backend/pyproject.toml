[project]
name = "rag-backend"
version = "0.1.0"
description = "Local RAG pipeline — backend"
authors = [
    { name = "Ali-Wassouf", email = "ali.wassouf93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "tokenizers>=0.23.2",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF is a C-extension library whose stubs don't fully annotate call
# signatures — disallow_untyped_calls fires on essentially every API call.
module = "app.extract.pdf"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# ebooklib ships no stubs and no py.typed marker.
module = "ebooklib"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "types-aiofiles>=25.1.0.20260518",
]
