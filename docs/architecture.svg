<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1500" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Local RAG Pipeline — System Architecture</text>
  <text x="800" y="57" text-anchor="middle" font-size="13" fill="#6B7280">How the pieces fit together — see Component Internals below for what each one actually does</text>

  <!-- ===================== Zone bands ===================== -->
  <rect x="40" y="75" width="1520" height="195" fill="#EFF6FF"/>
  <text x="60" y="95" font-size="11" font-weight="700" letter-spacing="1" fill="#1D4ED8">CLIENT</text>

  <rect x="40" y="280" width="1520" height="220" fill="#F5F3FF"/>
  <text x="60" y="300" font-size="11" font-weight="700" letter-spacing="1" fill="#6D28D9">APPLICATION</text>

  <rect x="40" y="510" width="1520" height="160" fill="#FFFBEB"/>
  <text x="60" y="530" font-size="11" font-weight="700" letter-spacing="1" fill="#B45309">DATA</text>

  <rect x="40" y="680" width="1520" height="150" fill="#FFF1F2"/>
  <text x="60" y="700" font-size="11" font-weight="700" letter-spacing="1" fill="#BE123C">MODELS</text>

  <!-- ===================== Components ===================== -->

  <!-- Browser -->
  <rect x="680" y="100" width="240" height="55" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="800" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#1E3A8A">Browser</text>
  <text x="800" y="141" text-anchor="middle" font-size="11" fill="#1E3A8A">renders the UI</text>

  <!-- Frontend -->
  <rect x="620" y="185" width="360" height="75" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="800" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">Frontend</text>
  <text x="800" y="232" text-anchor="middle" font-size="12" fill="#1E3A8A">Single-page app — upload &amp; review UI</text>
  <text x="800" y="249" text-anchor="middle" font-size="11" fill="#1E3A8A">talks to the Backend API over HTTP</text>

  <!-- Backend API -->
  <rect x="620" y="300" width="360" height="75" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="800" y="327" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">Backend API</text>
  <text x="800" y="347" text-anchor="middle" font-size="12" fill="#5B21B6">REST API — the frontend's only entry point</text>
  <text x="800" y="364" text-anchor="middle" font-size="11" fill="#5B21B6">projects, documents, jobs, structure</text>

  <!-- Ingest Worker -->
  <rect x="140" y="400" width="300" height="75" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="290" y="427" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">Ingest Worker</text>
  <text x="290" y="447" text-anchor="middle" font-size="12" fill="#5B21B6">Background process</text>
  <text x="290" y="464" text-anchor="middle" font-size="11" fill="#5B21B6">turns a document into searchable chunks</text>

  <!-- Query Engine -->
  <rect x="1160" y="400" width="300" height="75" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="1310" y="427" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">Query Engine</text>
  <text x="1310" y="447" text-anchor="middle" font-size="12" fill="#5B21B6">Runs per chat request</text>
  <text x="1310" y="464" text-anchor="middle" font-size="11" fill="#5B21B6">retrieves, reranks, and answers</text>

  <!-- Local File Storage -->
  <rect x="140" y="530" width="300" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="290" y="557" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">Local File Storage</text>
  <text x="290" y="577" text-anchor="middle" font-size="12" fill="#92400E">original uploaded files</text>
  <text x="290" y="592" text-anchor="middle" font-size="11" fill="#92400E">on disk, not in the database</text>

  <!-- Postgres -->
  <rect x="610" y="530" width="380" height="110" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="800" y="559" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">Postgres</text>
  <text x="800" y="580" text-anchor="middle" font-size="12" fill="#92400E">the single data store</text>
  <text x="800" y="600" text-anchor="middle" font-size="11.5" fill="#92400E">documents · structure · chunks · vectors</text>
  <text x="800" y="618" text-anchor="middle" font-size="11" font-style="italic" fill="#92400E">pgvector + ltree extensions</text>

  <!-- Ollama -->
  <rect x="610" y="700" width="380" height="110" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/>
  <text x="800" y="718" text-anchor="middle" font-size="14" font-weight="700" fill="#9F1239">Ollama — local model server</text>

  <rect x="625" y="728" width="170" height="68" rx="6" fill="#FFF1F2" stroke="#E11D48" stroke-width="1"/>
  <text x="710" y="750" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9F1239">Embedder</text>
  <text x="710" y="767" text-anchor="middle" font-size="10.5" fill="#9F1239">text → vector</text>
  <text x="710" y="782" text-anchor="middle" font-size="10.5" fill="#9F1239">ingest only</text>

  <rect x="805" y="728" width="170" height="68" rx="6" fill="#FFF1F2" stroke="#E11D48" stroke-width="1"/>
  <text x="890" y="750" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9F1239">Generator</text>
  <text x="890" y="767" text-anchor="middle" font-size="10.5" fill="#9F1239">writes answers</text>
  <text x="890" y="782" text-anchor="middle" font-size="10.5" fill="#9F1239">query only</text>

  <!-- Reranker -->
  <rect x="1160" y="700" width="300" height="90" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1310" y="727" text-anchor="middle" font-size="15" font-weight="700" fill="#9F1239">Reranker</text>
  <text x="1310" y="747" text-anchor="middle" font-size="12" fill="#9F1239">scores retrieved passages</text>
  <text x="1310" y="764" text-anchor="middle" font-size="11" font-style="italic" fill="#9F1239">in-process — not served via Ollama</text>

  <!-- ===================== Arrows ===================== -->

  <line x1="800" y1="155" x2="800" y2="183" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="800" y1="260" x2="800" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="812" y="284" font-size="11" fill="#374151">HTTP</text>

  <line x1="655" y1="375" x2="410" y2="400" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="393" font-size="10.5" fill="#374151">creates ingest job</text>

  <line x1="945" y1="375" x2="1190" y2="400" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1000" y="393" font-size="10.5" fill="#374151">chat request</text>

  <line x1="800" y1="375" x2="800" y2="528" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="812" y="455" font-size="11" fill="#374151">CRUD</text>

  <line x1="680" y1="375" x2="410" y2="530" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="440" font-size="10.5" fill="#374151">stores uploaded file</text>

  <line x1="290" y1="475" x2="290" y2="528" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="505" font-size="10.5" fill="#374151">reads file</text>

  <line x1="440" y1="460" x2="608" y2="570" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="495" font-size="10.5" fill="#374151">writes chunks + embeddings</text>

  <line x1="440" y1="475" x2="608" y2="742" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="640" font-size="10.5" fill="#374151">embed request</text>

  <line x1="1160" y1="460" x2="992" y2="570" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1005" y="495" font-size="10.5" fill="#374151">vector + keyword search</text>

  <line x1="1160" y1="475" x2="992" y2="742" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1290" y="640" font-size="10.5" fill="#374151">generate request</text>

  <line x1="1310" y1="475" x2="1310" y2="698" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1325" y="590" font-size="10.5" fill="#374151">rerank</text>

  <!-- ===================== Component Internals ===================== -->

  <text x="60" y="880" font-size="19" font-weight="700" fill="#111827">Component Internals</text>
  <text x="60" y="900" font-size="12.5" fill="#6B7280">What each box above is actually responsible for</text>

  <!-- Row 1 -->
  <g>
    <rect x="60" y="920" width="480" height="170" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <text x="82" y="948" font-size="14" font-weight="700" fill="#1E3A8A">Browser</text>
    <text x="82" y="970" font-size="12" fill="#374151">Where the UI actually renders. No server-</text>
    <text x="82" y="988" font-size="12" fill="#374151">side rendering — the whole app is client-side.</text>
  </g>

  <g>
    <rect x="560" y="920" width="480" height="170" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <text x="582" y="948" font-size="14" font-weight="700" fill="#1E3A8A">Frontend</text>
    <text x="582" y="970" font-size="12" fill="#374151">A single-page app: upload a document, then</text>
    <text x="582" y="988" font-size="12" fill="#374151">review and edit the structure it was split</text>
    <text x="582" y="1006" font-size="12" fill="#374151">into. Talks to the Backend API over HTTP.</text>
  </g>

  <g>
    <rect x="1060" y="920" width="480" height="170" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <text x="1082" y="948" font-size="14" font-weight="700" fill="#5B21B6">Backend API</text>
    <text x="1082" y="970" font-size="12" fill="#374151">The frontend's only entry point. Handles</text>
    <text x="1082" y="988" font-size="12" fill="#374151">uploads and project/document management,</text>
    <text x="1082" y="1006" font-size="12" fill="#374151">and creates a job whenever a document</text>
    <text x="1082" y="1024" font-size="12" fill="#374151">needs processing.</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="60" y="1110" width="480" height="170" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <text x="82" y="1138" font-size="14" font-weight="700" fill="#5B21B6">Ingest Worker</text>
    <text x="82" y="1160" font-size="12" fill="#374151">Runs independently of the API so a large</text>
    <text x="82" y="1178" font-size="12" fill="#374151">document never blocks the app. Picks up one</text>
    <text x="82" y="1196" font-size="12" fill="#374151">job at a time and carries it through</text>
    <text x="82" y="1214" font-size="12" fill="#374151">extraction → structuring → chunking → embedding.</text>
  </g>

  <g>
    <rect x="560" y="1110" width="480" height="170" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <text x="582" y="1138" font-size="14" font-weight="700" fill="#5B21B6">Query Engine</text>
    <text x="582" y="1160" font-size="12" fill="#374151">Runs per chat request, not in the</text>
    <text x="582" y="1178" font-size="12" fill="#374151">background. Retrieves candidate passages,</text>
    <text x="582" y="1196" font-size="12" fill="#374151">reranks them, then asks the generator to</text>
    <text x="582" y="1214" font-size="12" fill="#374151">answer using only what it actually retrieved.</text>
  </g>

  <g>
    <rect x="1060" y="1110" width="480" height="170" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <text x="1082" y="1138" font-size="14" font-weight="700" fill="#92400E">Local File Storage</text>
    <text x="1082" y="1160" font-size="12" fill="#374151">Keeps the original uploaded file on disk,</text>
    <text x="1082" y="1178" font-size="12" fill="#374151">separate from the database, so a document</text>
    <text x="1082" y="1196" font-size="12" fill="#374151">can be reprocessed without asking the user</text>
    <text x="1082" y="1214" font-size="12" fill="#374151">to upload it again.</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="60" y="1300" width="480" height="170" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <text x="82" y="1328" font-size="14" font-weight="700" fill="#92400E">Postgres</text>
    <text x="82" y="1350" font-size="12" fill="#374151">The only database in the system. One</text>
    <text x="82" y="1368" font-size="12" fill="#374151">extension (pgvector) gives it vector similarity</text>
    <text x="82" y="1386" font-size="12" fill="#374151">search; another (ltree) gives it fast queries</text>
    <text x="82" y="1404" font-size="12" fill="#374151">over a section tree — structure, text, and</text>
    <text x="82" y="1422" font-size="12" fill="#374151">embeddings all live in one place.</text>
  </g>

  <g>
    <rect x="560" y="1300" width="480" height="170" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <text x="582" y="1328" font-size="14" font-weight="700" fill="#9F1239">Ollama</text>
    <text x="582" y="1350" font-size="12" fill="#374151">A local model server that loads one model at</text>
    <text x="582" y="1368" font-size="12" fill="#374151">a time: an embedder while ingesting</text>
    <text x="582" y="1386" font-size="12" fill="#374151">documents, a generator while answering</text>
    <text x="582" y="1404" font-size="12" fill="#374151">questions. The two are never needed</text>
    <text x="582" y="1422" font-size="12" fill="#374151">simultaneously.</text>
  </g>

  <g>
    <rect x="1060" y="1300" width="480" height="170" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <text x="1082" y="1328" font-size="14" font-weight="700" fill="#9F1239">Reranker</text>
    <text x="1082" y="1350" font-size="12" fill="#374151">Re-scores retrieved passages against the</text>
    <text x="1082" y="1368" font-size="12" fill="#374151">question before they reach the generator.</text>
    <text x="1082" y="1386" font-size="12" fill="#374151">Runs inside the Query Engine's own process</text>
    <text x="1082" y="1404" font-size="12" fill="#374151">rather than through Ollama, since reranking</text>
    <text x="1082" y="1422" font-size="12" fill="#374151">doesn't fit a chat-style API.</text>
  </g>

</svg>
